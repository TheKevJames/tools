version: 2.1

executors:
  # glibc base: prek delegates python management to uv, and uv-managed
  # python-build-standalone interpreters cannot load musl native-extension
  # wheels (eg. rpds-py via check-jsonschema). Alpine breaks those hooks.
  default:
    docker:
      - image: cimg/base:current
    resource_class: small

jobs:
  prek:
    executor: <<parameters.executor>>
    parameters:
      args:
        default: '-a --show-diff-on-failure'
        type: string
      cache_prefix:
        default: ''
        type: string
      config_file:
        default: '.pre-commit-config.yaml'
        type: string
      executor:
        default: default
        type: executor
    steps:
      - checkout
      - run:
          name: install uv and prek
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            uv tool install prek
      - restore_cache:
          keys:
            - cache-prek-<<parameters.cache_prefix>>-{{ checksum "<<parameters.config_file>>" }}
      - run: prek install-hooks -c <<parameters.config_file>>
      - save_cache:
          key: cache-prek-<<parameters.cache_prefix>>-{{ checksum "<<parameters.config_file>>" }}
          paths:
            - ~/.cache/prek
      - run: prek run <<parameters.args>> -c <<parameters.config_file>>
