[project]
name = "atc1441-exporter"
version = "0.1.9"
description = "ATC1441 (passive) Sensor data OpenMetrics Exporter"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }

authors = [{ name = "Kevin James", email = "KevinJames@thekev.in" }]

# BLE scanning uses a vendored, pruned subset of aioblescan (pure-Python, raw
# HCI socket) at atc1441_exporter/_aioblescan.py; it has no runtime dependency.
dependencies = [
    "prometheus-client==0.26.0",
]

[project.urls]
repository = "https://github.com/TheKevJames/tools"

[dependency-groups]
dev = [
    "flake8-broken-line==1.0.0",
    "flake8-complicated-walrus==2.1.0",
    "flake8-import-restrictions==2.1",
    "flake8-requirements==2.3.0",
    "flake8==7.3.0",
    "pylint==3.3.9",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ty.environment]
python-platform = "linux"
python-version = "3.11"

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.uv]
package = false
