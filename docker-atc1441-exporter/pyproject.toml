[project]
name = "atc1441-exporter"
version = "0.1.8"
description = "ATC1441 (passive) Sensor data OpenMetrics Exporter"
requires-python = ">=3.9,<4.0"
license = { text = "MIT" }

authors = [{ name = "Kevin James", email = "KevinJames@thekev.in" }]

dependencies = [
    "prometheus-client==0.26.0",
    "pybluez==0.23; sys_platform == 'linux'",
]

[project.urls]
repository = "https://github.com/TheKevJames/tools"

[dependency-groups]
dev = [
    "flake8-broken-line==1.0.0",
    "flake8-complicated-walrus==2.1.0",
    "flake8-import-restrictions==2.1",
    "flake8-requirements==2.3.0",
    "flake8==7.3.0",
    "pylint==3.3.9",
]

[tool.ty.environment]
python-platform = "linux"

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
# pybluez's setup.py uses use_2to3 (removed in setuptools 58)
pybluez = ["setuptools<58"]
# pyobjc-core (its macOS dep) needs pkg_resources (removed in setuptools 81)
pyobjc-core = ["setuptools<81"]
