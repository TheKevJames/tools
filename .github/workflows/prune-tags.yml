name: prune-tags

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: log the would-delete tags without deleting them
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prune:
    name: prune-${{ matrix.image }}
    uses: ./.github/workflows/_prune-tags.yml
    secrets: inherit
    strategy:
      matrix:
        image:
          - atc1441-exporter
          - caddy-security
          - fava
          - gcloud-pubsub-emulator
          - mysqltuner
          - tuning-primer
    with:
      image: ${{ matrix.image }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
