name: _github-release

# Reusable workflow: on a release tag, publish the GitHub Release for it, with
# notes from git-cliff (the caller's cliff.toml) and optionally an artifact of
# the calling run attached. The caller grants `contents: write`:
#   jobs:
#     github-release:
#       needs: [publish]
#       if: startsWith(github.ref, 'refs/tags/')
#       permissions:
#         contents: write
#       uses: TheKevJames/tools/.github/workflows/_github-release.yml@master
#       with:
#         artifact: dist
#
# Releases are immutable once published, so it is created as a draft, with
# its assets, and only then published. The tag must already exist: the tags
# ruleset would refuse to create it.
#
# Notes cover every commit since the previous final release, so a release's
# notes include its pre-releases' changes.

on:
  workflow_call:
    inputs:
      artifact:
        description: name of an artifact of this run to attach
        default: ''
        type: string
      tag-prefix:
        description: only tags with this prefix count, eg. `cctui-`
        default: ''
        type: string

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: range
        env:
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          # The tag reaches git-cliff's arguments below.
          if ! [[ "${GITHUB_REF_NAME}" =~ ^${TAG_PREFIX}[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::not a release tag: '${GITHUB_REF_NAME}'"
            exit 1
          fi
          range="${GITHUB_REF_NAME}"
          if previous="$(git describe --tags --abbrev=0 \
              --match "${TAG_PREFIX}[0-9]*" \
              --exclude '*a[0-9]*' --exclude '*b[0-9]*' --exclude '*rc[0-9]*' \
              "${GITHUB_REF_NAME}^" 2>/dev/null)"; then
            range="${previous}..${GITHUB_REF_NAME}"
          fi
          echo "range=${range}" >> "${GITHUB_OUTPUT}"
      - id: notes
        uses: orhun/git-cliff-action@v4.9.1
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }} --strip all ${{ steps.range.outputs.range }}
      - if: inputs.artifact != ''
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/assets
      - env:
          ASSETS: ${{ runner.temp }}/assets
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.changelog }}
        run: |
          flags=()
          if [[ "${GITHUB_REF_NAME}" =~ (a|b|rc)[0-9]+$ ]]; then
            flags+=(--prerelease)
          fi
          assets=()
          if [ -d "${ASSETS}" ]; then
            assets=("${ASSETS}"/*)
          fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --draft \
            --title "${GITHUB_REF_NAME}" --notes-file "${NOTES}" "${flags[@]}"
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --draft=false
