name: _rulesets

# Deprecated: callers predating .github/actions-permissions.json, until
# `repo-template sync` moves them to _repo-settings.yml.
# TODO: delete, with _repo-settings.yml's rulesets-only input, once no caller
# uses it.

on:
  workflow_call:
    secrets:
      RULESETS_TOKEN:
        description: fine-grained PAT with Administration:write on the caller
        required: false

permissions:
  contents: read

jobs:
  rulesets:
    uses: TheKevJames/tools/.github/workflows/_repo-settings.yml@master
    with:
      rulesets-only: true
    secrets:
      REPO_SETTINGS_TOKEN: ${{ secrets.RULESETS_TOKEN }}
