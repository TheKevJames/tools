name: _docker-image

# Reusable workflow: build + push a Docker image to docker.io and quay.io, and
# (on master) publish its README. Published for cross-repo consumption, eg.
#   uses: TheKevJames/tools/.github/workflows/_docker-image.yml@master
# The leading underscore marks this as a reusable building block rather than a
# triggered workflow; see README.rst.

on:
  workflow_call:
    inputs:
      image:
        description: image name, published as thekevjames/<image> (+ quay mirror)
        required: true
        type: string
      context:
        description: build context; also the readme/tag-cmd working directory
        default: .
        type: string
      dockerfile:
        description: Dockerfile path relative to context
        default: Dockerfile
        type: string
      target:
        description: build target stage
        default: ''
        type: string
      platforms:
        default: linux/amd64
        type: string
      readme:
        description: reStructuredText readme source, relative to context
        default: README.rst
        type: string
      tag-cmd:
        description: shell command (run in context) echoing a custom master-only tag
        default: ''
        type: string
      publish-readme:
        default: true
        type: boolean
    secrets:
      DOCKER_USER:
        required: false
      DOCKER_PASS:
        required: false
      QUAY_USER:
        required: false
      QUAY_PASS:
        required: false
      QUAY_APIKEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PASS }}
      - id: tag
        if: ${{ inputs.tag-cmd != '' && github.ref == 'refs/heads/master' }}
        working-directory: ${{ inputs.context }}
        env:
          TAG_CMD: ${{ inputs.tag-cmd }}
        run: echo "value=$(bash -c "$TAG_CMD")" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: meta
        with:
          images: |
            thekevjames/${{ inputs.image }}
            quay.io/thekevjames/${{ inputs.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.tag.outputs.value }},enable=${{ steps.tag.outputs.value != '' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  readme:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && inputs.publish-readme }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://pandoc/core:3.11.0@sha256:62518bfb6833705dc90a1634d8d879299bd820b3f74ad3b32fba8b618452553a
        with:
          args: -o README.md ${{ inputs.context }}/${{ inputs.readme }}
      # docker-pushrm's releases publish no checksums, but its image can be
      # pinned by digest.
      - uses: docker://chko/docker-pushrm:1.9.0@sha256:812a950e5be7dca26cef33b61eb2076bfcfb6c2a8ec96c126371fc049c3b6608
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        with:
          args: --file README.md thekevjames/${{ inputs.image }}
      - uses: docker://chko/docker-pushrm:1.9.0@sha256:812a950e5be7dca26cef33b61eb2076bfcfb6c2a8ec96c126371fc049c3b6608
        env:
          APIKEY__QUAY_IO: ${{ secrets.QUAY_APIKEY }}
        with:
          args: --file README.md quay.io/thekevjames/${{ inputs.image }}
