[project]
name = "gha-tools"
version = "0.1.0"
description = "Shared helpers backing TheKevJames/tools reusable GitHub workflows"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [{ name = "Kevin James", email = "KevinJames@thekev.in" }]

dependencies = [
    "pyyaml==6.0.3",
]

[project.urls]
repository = "https://github.com/TheKevJames/tools"

[dependency-groups]
dev = [
    "flake8-broken-line==1.0.0",
    "flake8-complicated-walrus==2.1.0",
    "flake8-import-restrictions==2.1",
    "flake8-requirements==2.3.0",
    "flake8==7.4.1",
    "hypothesis==6.170.11",
    "pylint==4.1.3",
    "pytest-xdist==3.8.0",
    "pytest==9.2.0",
    "types-pyyaml==6.0.12.20260906",
]

[tool.pylint.main]
# gha_tools is not installed (package = false), so without this pylint can
# only resolve its imports when the package itself is among the linted files.
source-roots = ["."]

[tool.pytest.ini_options]
addopts = "-n auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ty.environment]
python-platform = "linux"
python-version = "3.11"

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.uv]
package = false
